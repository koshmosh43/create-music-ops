<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <g transform-origin="16 16">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 16 16"
      to="360 16 16"
      dur="3s"
      repeatCount="indefinite"
    />
    <circle cx="16" cy="16" r="14" fill="#0a090f" stroke="#f0e81f" stroke-width="1.25" />
    <circle
      cx="16"
      cy="16"
      r="14"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.05"
      stroke-width="0.5"
      stroke-dasharray="1.2 2.4"
    />
    <circle cx="16" cy="16" r="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.4" />
    <circle cx="16" cy="16" r="5.2" fill="#16141f" stroke="#f0e81f" stroke-width="0.75" stroke-opacity="0.85" />
    <circle cx="16" cy="16" r="1.6" fill="#f0e81f" />
    <ellipse cx="13.5" cy="12.5" rx="5" ry="2" fill="#ffffff" fill-opacity="0.06" transform="rotate(-24 16 16)" />
  </g>
</svg>
